name: Deploy

# Every push to main: test, build the images, then release them on the EC2 server.
# To go back to an earlier release without rebuilding: Actions -> Deploy -> Run workflow -> rollback_tag.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Redeploy an image that is already built, e.g. sha-1a2b3c4. Leave empty for a normal deploy of this branch."
        required: false
        default: ""

# One release at a time, and never stop one half way.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: ${{ inputs.rollback_tag == '' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build and push images
    needs: ci
    if: ${{ inputs.rollback_tag == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name and tag
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Lets one runner build for both kinds of EC2 server (x86 and Graviton).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set the repository variable PLATFORMS (for example linux/arm64) to build for one architecture only: faster.
      - name: Build and push the API and worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Build and push the migration and seed image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          platforms: ${{ vars.PLATFORMS || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.image }}:tools-${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tools
          cache-to: type=gha,scope=tools,mode=max

  deploy:
    name: Release on EC2
    needs: build
    # Release when the build succeeded, or when a rollback was asked for (which skips the build on purpose).
    # A failed test run skips the build without a rollback request, so it never gets here.
    if: ${{ !cancelled() && (needs.build.result == 'success' || (inputs.rollback_tag != '' && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.rollback_tag || needs.build.outputs.tag }}
      ACTOR: ${{ github.actor }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
      EC2_PORT: ${{ secrets.EC2_PORT || '22' }}
      APP_DIR: /opt/interviewcall-tests
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "Not a valid image tag: $TAG" >&2; exit 1; }
          [[ "$ACTOR" =~ ^[A-Za-z0-9_.-]{1,64}$ ]] || { echo "Unexpected user name" >&2; exit 1; }

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$EC2_KNOWN_HOSTS" ]; then
            printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Trusts the server's key on first sight. Save the output of ssh-keyscan as the EC2_KNOWN_HOSTS secret to pin it.
            ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CONFIG
          Host target
            HostName $EC2_HOST
            User $EC2_USER
            Port $EC2_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          CONFIG

      - name: Send the compose file, proxy config and scripts
        run: |
          # The values here were checked in the first step, so expanding them on this side is intended.
          # shellcheck disable=SC2029
          tar -C deploy -cf - docker-compose.yml Caddyfile deploy.sh backup.sh mariadb \
            | ssh target "tar -C $APP_DIR -xf -"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The token goes over stdin, so it never appears in a process list or a log.
          # shellcheck disable=SC2029
          printf '%s\n' "$GITHUB_TOKEN" | ssh target "bash $APP_DIR/deploy.sh $TAG $ACTOR"

      - name: Check the public address
        if: ${{ vars.API_HEALTH_URL != '' }}
        env:
          URL: ${{ vars.API_HEALTH_URL }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$URL"

      - name: Summary
        run: echo "Released \`$TAG\` to production." >> "$GITHUB_STEP_SUMMARY"
